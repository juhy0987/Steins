openapi: 3.0.3
info:
  title: Steins API
  version: 0.1.0
  description: |
    Steins 만화 뷰어의 v0 공개 API.

    이미지 무결성:
    - `GET /api/v1/chapters/{id}/pages` 응답의 각 페이지에는 SHA-256 체크섬이 포함됩니다.
      포맷은 `sha-256:<base64>` 입니다.
    - `GET /api/v1/chapters/{id}/pages/{index}/image` 응답은 RFC 9530 형식의
      `Digest: sha-256=<base64>` 헤더를 포함합니다.
    - 클라이언트는 다운로드 바이트의 SHA-256 을 계산해 매니페스트의 체크섬 또는
      `Digest` 헤더와 일치하는지 확인해야 합니다.
servers:
  - url: /
    description: Same-origin (개발/로컬)

tags:
  - name: system
    description: 헬스체크 등 시스템 엔드포인트
  - name: manga
    description: 만화 시리즈 카탈로그
  - name: chapter
    description: 챕터 메타데이터
  - name: reader
    description: 페이지 매니페스트와 이미지 서빙

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness check
      description: 서버가 살아있는지 확인하는 가벼운 헬스체크.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/manga:
    get:
      tags: [manga]
      summary: 만화 카탈로그 목록 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Manga'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
                required: [data]

  /api/v1/manga/{slug}:
    get:
      tags: [manga]
      summary: 만화 상세 조회
      parameters:
        - $ref: '#/components/parameters/MangaSlug'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Manga'
                required: [data]
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/manga/{slug}/chapters:
    get:
      tags: [chapter]
      summary: 만화의 챕터 목록 조회
      parameters:
        - $ref: '#/components/parameters/MangaSlug'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Chapter'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
                required: [data]
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chapters/{id}/pages:
    get:
      tags: [reader]
      summary: 페이지 매니페스트 (체크섬 포함) 조회
      description: |
        해당 챕터의 모든 페이지를 페이지별 SHA-256 체크섬과 함께 반환합니다.
        클라이언트는 각 `pages[].url` 로 이미지 바이트를 받은 뒤, 다운로드 바이트의
        SHA-256 을 매니페스트의 `checksum` 과 비교해 무결성을 검증할 수 있습니다.
      parameters:
        - $ref: '#/components/parameters/ChapterID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Manifest'
                required: [data]
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chapters/{id}/pages/{index}/image:
    get:
      tags: [reader]
      summary: 페이지 이미지 바이트 서빙
      description: |
        응답 헤더 `Digest: sha-256=<base64>` 가 본문의 SHA-256 무결성 값입니다 (RFC 9530).
        매니페스트의 `pages[].checksum` (`sha-256:<base64>`) 과 비교해 검증할 수 있습니다.
      parameters:
        - $ref: '#/components/parameters/ChapterID'
        - name: index
          in: path
          required: true
          description: 1-based 페이지 인덱스
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 이미지 바이트
          headers:
            Digest:
              description: RFC 9530 형식의 SHA-256 무결성 헤더 (`sha-256=<base64>`).
              schema:
                type: string
            ETag:
              description: 본문 SHA-256 base64 값을 따옴표로 감싼 ETag.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: public, no-cache, must-revalidate
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    MangaSlug:
      name: slug
      in: path
      required: true
      description: 만화 시리즈 slug (URL-safe).
      schema:
        type: string
        example: steins-sample
    ChapterID:
      name: id
      in: path
      required: true
      description: 챕터 ID (`<manga-slug>__<number>` 형식).
      schema:
        type: string
        example: steins-sample__0001

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
      required: [status]

    ListMeta:
      type: object
      properties:
        count:
          type: integer
          minimum: 0

    Manga:
      type: object
      properties:
        id: {type: string}
        slug: {type: string}
        title: {type: string}
        alt_titles:
          type: array
          items: {type: string}
        description: {type: string}
        cover_url: {type: string}
        authors:
          type: array
          items: {type: string}
        genres:
          type: array
          items: {type: string}
        status:
          type: string
          enum: [ongoing, completed, hiatus, cancelled]
        language:
          type: string
          description: ISO 639-1 (예시 ko / en)
        reading_dir:
          type: string
          enum: [ltr, rtl, vertical]
        published_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      required: [id, slug, title, status, language, reading_dir]

    Chapter:
      type: object
      properties:
        id: {type: string}
        manga_id: {type: string}
        manga_slug: {type: string}
        number:
          type: string
          description: 챕터 번호 (소수점 표기 가능 — "0001", "12.5" 등)
        title: {type: string}
        language: {type: string}
        page_count:
          type: integer
          minimum: 0
        published_at: {type: string, format: date-time}
      required: [id, manga_id, manga_slug, number, page_count]

    Page:
      type: object
      properties:
        index:
          type: integer
          minimum: 1
        url:
          type: string
          description: 이미지 바이트 서빙 URL (상대 경로).
        byte_size:
          type: integer
          format: int64
        mime_type:
          type: string
          enum: [image/png, image/jpeg, image/webp]
        checksum:
          type: string
          description: |
            무결성 검증용 본문 해시. 형식 `sha-256:<base64>` (base64 표준 인코딩).
          example: 'sha-256:GqMCyFFpV0z921xLTFEd6gN+WN9cW/12LFIBbfnKNP4='
      required: [index, url, byte_size, mime_type, checksum]

    Manifest:
      type: object
      properties:
        chapter_id: {type: string}
        manga_id: {type: string}
        manga_slug: {type: string}
        number: {type: string}
        reading_dir:
          type: string
          enum: [ltr, rtl, vertical]
        page_count:
          type: integer
          minimum: 0
        pages:
          type: array
          items:
            $ref: '#/components/schemas/Page'
      required: [chapter_id, manga_id, manga_slug, number, reading_dir, page_count, pages]

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: 머신-판독 에러 코드 (예 `MANGA_NOT_FOUND`, `VAL_001`).
            message:
              type: string
            details:
              type: object
              additionalProperties: true
          required: [code, message]
      required: [error]

  responses:
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: 입력 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
